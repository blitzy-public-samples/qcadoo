<!--
    DOM fixture of the Gantt chart component for ganttChartMove.dom.test.js, opened from file:// in chrome-headless-shell.

    The head loads every stylesheet and script of the uncompressed branch of WEB-INF/jsp/crud/crudView.jsp, in the same
    order, from src/main/resources/qcadooView/public. The body holds a fixed 800 x 300 px host into which
    window.__loadBoard(name, overrides) renders the component.jsp and ganttChart.jsp markup of
    window.mainTab.gridLayout.gantt, the component path of the gantt component of the productionMaintenanceGantt view,
    and constructs QCD.components.elements.GanttChart the way pageConstructor.js does. window.mainController is a
    recording stub that answers every event with canned values after a zero delay, with two exceptions: a moveItem
    with an httpReply answer runs through the real event transport, and a moveItem with a hold: true answer is
    answered only after window.__releaseHeldMove().

    Page API:
      window.__loadBoard(name, overrides)  renders board `name`; overrides.options and overrides.board replace keys of the
                                           component options and of the board content
      window.__boards                      frozen board definitions, each {options, board}
      window.__boardFor(name)              mutable deep copy of the board content of `name`
      window.__gantt                       the constructed GanttChart component
      window.__calls                       recorded events, each {eventName, component, args}
      window.__messages                    messages passed to mainController.showMessage
      window.__nextMoveResponse            answer of the next moveItem, one of the kinds below; with hold: true the
                                           moveItem is recorded and its answer waits for window.__releaseHeldMove()
                                             {kind: 'rejected', message}     content {moveResult: {itemId,
                                                                             accepted: false, message}} only
                                             {kind: 'accepted', board}       the board content plus moveResult
                                                                             {itemId, accepted: true}; board becomes
                                                                             window.__currentBoard
                                             {kind: 'failure'}               a failed request: runs only the
                                                                             complete function
                                             {kind: 'serverError'}           the framework error page: passes the
                                                                             failure message SERVER_ERROR_MESSAGE to
                                                                             mainController.showMessage, then runs
                                                                             only the complete function
                                             {kind: 'acceptedWithoutBoard'}  content {moveResult: {itemId,
                                                                             accepted: true}} only
                                             {kind: 'httpReply', status, body}
                                                                             sends the moveItem through the real
                                                                             QCD.PageController.callEvent,
                                                                             performEvent, QCDConnector.sendPost and
                                                                             jQuery.ajax of a page controller without
                                                                             page components; an XMLHttpRequest
                                                                             stand-in answers it with that status and
                                                                             body and a JSON content type (hold does
                                                                             not apply); the answer is recorded once,
                                                                             after the complete function the transport
                                                                             calls, or after a zero delay when jQuery
                                                                             rejects the request, whichever runs first
                                           null answers with the default response
      window.__httpRequests                requests sent for httpReply answers, each {method, url, async, body, headers}
      window.__headerButtonCalls           "block" and "unblock" calls of the window header of that page controller
      window.__releaseHeldMove()           answers the held moveItem after a zero delay, with the generation check and
                                           the __seq and __lastResponseApplied bookkeeping of every answer; returns
                                           false after recording a fixture error when no moveItem is held
      window.__lastResponseApplied         {eventName, seq} of the last answered event, or null
      window.__currentBoard                board content answered to refresh and initialize
      window.__pageErrors                  uncaught errors, unhandled rejections, asset load failures and fixture errors

    Boards: h1, h3, h6, d1, offGrid, covered, markupRows, dst, scrolled, moveDisabled.

    After each answer that unblocks the component, the blockUI overlay of LoadingIndicator fades out for 400 ms and
    stays over the chart until no .blockUI element remains inside window.mainTab.gridLayout.gantt.
-->
<html>
<head>
    <meta charset="utf-8">
    <title>Gantt chart move - DOM fixture</title>

    <script type="text/javascript">
        // Records uncaught errors, unhandled promise rejections and stylesheet or script load failures as
        // {message, source, line, column}.
        window.__pageErrors = [];
        window.onerror = function (message, source, line, column) {
            window.__pageErrors.push({
                message: String(message),
                source: source || null,
                line: line || null,
                column: column || null
            });
            return false;
        };
        window.addEventListener("unhandledrejection", function (event) {
            var reason = event.reason;
            window.__pageErrors.push({
                message: (reason && reason.message) ? String(reason.message) : String(reason),
                source: null,
                line: null,
                column: null
            });
        });
        window.addEventListener("error", function (event) {
            var target = event.target;
            if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
                window.__pageErrors.push({
                    message: "Failed to load " + target.tagName.toLowerCase() + " asset",
                    source: target.src || target.href || null,
                    line: null,
                    column: null
                });
            }
        }, true);
    </script>

<body>

    <div id="ganttHost" style="position:absolute; left:0; top:0; width:800px; height:300px;"></div>

    <script type="text/javascript">
        (function () {
            "use strict";

            // Component path of the gantt component, which the productionMaintenanceGantt view nests in gridLayout.
            var GANTT_PATH = "window.mainTab.gridLayout.gantt";
            var GANTT_JS_OBJECT = "QCD.components.elements.GanttChart";
            var HOST_ID = "ganttHost";
            var HOST_WIDTH = 800;
            var HOST_HEIGHT = 300;
            var FIXTURE_SOURCE = "ganttChartMove.dom.html";
            var DEFAULT_MOVE_RESPONSE = {kind: "rejected", message: "Rejected by fixture"};

            // Message that QCDConnector.showErrorMessage passes to mainController.showMessage for the framework error
            // page.
            var SERVER_ERROR_MESSAGE = {
                title: "An error occurred in the system",
                content: "An error has occurred in the system. Please contact us or, if you are using the OS version,"
                    + " see the logs.",
                type: "failure"
            };

            // Hours spanned by one chart cell per zoom level.
            var HOURS_INTERVALS = {H1: 1, H3: 3, H6: 6, D1: 24};

            // Cells per day category and label step per hour-based zoom level.
            var HOUR_SCALES = {
                H1: {elementsInCategory: 24, elementLabelsInterval: 1},
                H3: {elementsInCategory: 8, elementLabelsInterval: 3},
                H6: {elementsInCategory: 4, elementLabelsInterval: 6}
            };

            var WEEK_DAY_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

            // Strip of a planned maintenance event without shutdown, in
            // ProductionMaintenanceGanttChartItemResolver.MAINTENANCE_COLOR.
            var MAINTENANCE_STRIP = {color: "#2E86C1", size: 100};

            // Component options of window.mainTab.gridLayout.gantt: the GanttChartComponentPattern.getJsOptions keys
            // with a subset of its translations, and the base component pattern keys. The translations lack
            // move.keyboardHelp, move.acceptedAnnouncement and move.cancelledAnnouncement, which
            // ganttChartMove.dom.test.js adds through the A11Y_OVERRIDES options of window.__loadBoard.
            var BASE_OPTIONS = {
                translations: {
                    "header.label": "Gantt",
                    "header.dateFrom": "From",
                    "header.dateTo": "To",
                    "header.zoom1h": "1h",
                    "header.zoom3h": "3h",
                    "header.zoom6h": "6h",
                    "header.zoom1d": "1d",
                    "description.dateFrom": "Start",
                    "description.dateTo": "End",
                    "colisionElementName": "Collision",
                    "colisionBox.header": "Overlapping items",
                    "colisionBox.closeButton": "Close",
                    "move.rejectedHeader": "Move rejected"
                },
                hasPopupInfo: true,
                allowDateSelection: true,
                allowItemMove: true,
                moveGridMinutes: 30,
                zoomHoursIntervals: {H1: 1, H3: 3, H6: 6, D1: 24},
                listeners: [GANTT_PATH],
                defaultEnabled: true,
                defaultRequired: false,
                defaultVisible: true,
                referenceName: "gantt",
                persistent: false,
                scriptFiles: []
            };

            // Increments on every board load; answers scheduled under an earlier value are dropped.
            var generation = 0;

            // Answer of the held moveItem, run by window.__releaseHeldMove, or null.
            var heldMoveAnswer = null;

            window.__gantt = null;
            window.__calls = [];
            window.__messages = [];
            window.__httpRequests = [];
            window.__headerButtonCalls = [];
            window.__seq = 0;
            window.__lastResponseApplied = null;
            window.__currentBoard = null;
            window.__nextMoveResponse = deepCopy(DEFAULT_MOVE_RESPONSE);

            // Returns a JSON deep copy of a value.
            function deepCopy(value) {
                return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
            }

            // Freezes an object and every object it contains, frozen or not, and returns it. The object graph must be
            // acyclic.
            function deepFreeze(value) {
                if (value !== null && typeof value === "object") {
                    Object.keys(value).forEach(function (key) {
                        deepFreeze(value[key]);
                    });
                    Object.freeze(value);
                }
                return value;
            }

            // Records an error of the fixture itself in window.__pageErrors.
            function recordFixtureError(message) {
                window.__pageErrors.push({message: message, source: FIXTURE_SOURCE, line: null, column: null});
            }

            // Returns wall-clock minutes since 1970-01-01 00:00:00 of a "yyyy-MM-dd" or "yyyy-MM-dd HH:mm:ss" date,
            // with the four-digit year taken literally, 0000 to 0099 included.
            function wallClockMinutes(text) {
                var match = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}):(\d{2}))?$/.exec(text);
                if (!match) {
                    throw new Error("Not a wall-clock date: " + text);
                }
                var date = new Date(0);
                date.setUTCFullYear(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
                date.setUTCHours(Number(match[4] || 0), Number(match[5] || 0), Number(match[6] || 0), 0);
                return date.getTime() / 60000;
            }

            // Returns the "yyyy-MM-dd" date of wall-clock minutes.
            function formatDay(minutes) {
                return new Date(minutes * 60000).toISOString().substring(0, 10);
            }

            // Returns the ISO day of week, 1 for Monday to 7 for Sunday, of a "yyyy-MM-dd" date.
            function isoWeekDay(day) {
                var weekDay = new Date(wallClockMinutes(day) * 60000).getUTCDay();
                return weekDay === 0 ? 7 : weekDay;
            }

            // Returns the chart cell position of a date: wall-clock hours since the scale start divided by the hours
            // interval, rounded down to a multiple of 0.1 cell; positions are not clamped to the scale range.
            function cellPosition(date, hoursInterval, scaleStart) {
                var minutes = wallClockMinutes(date) - wallClockMinutes(scaleStart);
                return Math.floor(minutes * 10 / (hoursInterval * 60)) / 10;
            }

            // Builds a Gantt item in the GanttChartItemImpl JSON shape; an item without an id has no id key.
            function item(row, id, name, start, end, hoursInterval, scaleStart, strips) {
                var ganttItem = {row: row};
                if (id !== null && id !== undefined) {
                    ganttItem.id = id;
                }
                ganttItem.from = cellPosition(start, hoursInterval, scaleStart);
                ganttItem.to = cellPosition(end, hoursInterval, scaleStart);
                ganttItem.info = {
                    name: name,
                    tooltip: {header: name, content: []},
                    dateFrom: start,
                    dateTo: end
                };
                ganttItem.strips = deepCopy(strips || []);
                return ganttItem;
            }

            // Builds a collision item over the given items in the GanttChartConflictItem JSON shape, spanning the
            // bounds of the supplied bounds item.
            function collision(row, bounds, items) {
                return {
                    row: row,
                    from: bounds.from,
                    to: bounds.to,
                    info: {
                        dateFrom: bounds.info.dateFrom,
                        dateTo: bounds.info.dateTo,
                        tooltip: {content: []}
                    },
                    strips: [],
                    items: deepCopy(items)
                };
            }

            // Returns one "yyyy-MM-dd" category per day from dateFrom to dateTo inclusive.
            function dayCategories(dateFrom, dateTo) {
                var categories = [];
                var last = wallClockMinutes(dateTo);
                for (var minutes = wallClockMinutes(dateFrom); minutes <= last; minutes += 24 * 60) {
                    categories.push(formatDay(minutes));
                }
                return categories;
            }

            // Builds the GanttChartScaleImpl JSON of an hour-based zoom level with one category per day.
            function hourScale(zoomLevel, dateFrom, dateTo) {
                return {
                    elementsInCategory: HOUR_SCALES[zoomLevel].elementsInCategory,
                    elementLabelsInterval: HOUR_SCALES[zoomLevel].elementLabelsInterval,
                    elementLabelInitialNumber: 0,
                    categories: dayCategories(dateFrom, dateTo)
                };
            }

            // Builds the GanttChartScaleImpl JSON of the D1 zoom level with the given week categories.
            function weekScale(dateFrom, dateTo, weekLabels) {
                return {
                    elementsInCategory: 7,
                    elementLabelsValues: WEEK_DAY_LABELS.slice(),
                    firstCategoryFirstElement: isoWeekDay(dateFrom),
                    lastCategoryLastElement: isoWeekDay(dateTo),
                    categories: weekLabels.slice()
                };
            }

            // Builds board content in the GanttChartComponentState.renderContent JSON shape with the
            // GanttChartComponentPattern defaults: itemsBorderWidth 0 and no itemsBorderColor key.
            function board(zoomLevel, dateFrom, dateTo, scale, rows, items, collisions) {
                return {
                    zoomLevel: zoomLevel,
                    dateFrom: dateFrom,
                    dateTo: dateTo,
                    scale: scale,
                    stripsOrientation: "horizontal",
                    itemsBorderWidth: 0,
                    rows: rows.slice(),
                    items: items,
                    collisions: collisions || []
                };
            }

            // Builds the order bar of an H1 board on 2026-06-01.
            function orderBarH1(row, id, name, start, end) {
                return item(row, id, name, "2026-06-01 " + start, "2026-06-01 " + end, HOURS_INTERVALS.H1, "2026-06-01");
            }

            // Builds the id-less maintenance bar PE-1 of an H1 board on L2, 2026-06-01 12:00-14:00.
            function maintenanceBarH1() {
                return item("L2", null, "PE-1", "2026-06-01 12:00:00", "2026-06-01 14:00:00", HOURS_INTERVALS.H1,
                    "2026-06-01", [MAINTENANCE_STRIP]);
            }

            // Returns the row names L01 to L<count>, numbered with two digits.
            function numberedRows(count) {
                var rows = [];
                for (var i = 1; i <= count; i++) {
                    rows.push("L" + (i < 10 ? "0" : "") + i);
                }
                return rows;
            }

            var LINES = ["L1", "L2", "L3"];

            var coveringOrder = orderBarH1("L1", 11, "ORD-11", "09:00:00", "12:00:00");
            var coveredOrder = orderBarH1("L1", 12, "ORD-12", "10:00:00", "11:00:00");

            // Board definitions, each {options, board}: options replace component option keys and board is the
            // content answered to refresh.
            var boards = {
                h1: {
                    options: {},
                    board: board("H1", "2026-06-01", "2026-06-01", hourScale("H1", "2026-06-01", "2026-06-01"), LINES, [
                        orderBarH1("L1", 7, "ORD-7", "09:00:00", "10:00:00"),
                        maintenanceBarH1()
                    ])
                },
                h3: {
                    options: {},
                    board: board("H3", "2026-06-01", "2026-06-03", hourScale("H3", "2026-06-01", "2026-06-03"), LINES, [
                        item("L1", 7, "ORD-7", "2026-06-01 09:00:00", "2026-06-01 12:00:00", HOURS_INTERVALS.H3, "2026-06-01")
                    ])
                },
                h6: {
                    options: {},
                    board: board("H6", "2026-06-01", "2026-06-03", hourScale("H6", "2026-06-01", "2026-06-03"), LINES, [
                        item("L1", 7, "ORD-7", "2026-06-01 06:00:00", "2026-06-01 12:00:00", HOURS_INTERVALS.H6, "2026-06-01")
                    ])
                },
                d1: {
                    options: {},
                    board: board("D1", "2026-06-01", "2026-06-07", weekScale("2026-06-01", "2026-06-07", ["Week 23"]), LINES, [
                        item("L1", 7, "ORD-7", "2026-06-02 00:00:00", "2026-06-03 00:00:00", HOURS_INTERVALS.D1, "2026-06-01")
                    ])
                },
                offGrid: {
                    options: {},
                    board: board("H1", "2026-06-01", "2026-06-01", hourScale("H1", "2026-06-01", "2026-06-01"), LINES, [
                        orderBarH1("L1", 8, "ORD-8", "10:07:00", "11:07:00"),
                        maintenanceBarH1()
                    ])
                },
                covered: {
                    options: {},
                    board: board("H1", "2026-06-01", "2026-06-01", hourScale("H1", "2026-06-01", "2026-06-01"), LINES,
                        [coveringOrder, coveredOrder], [collision("L1", coveredOrder, [coveringOrder, coveredOrder])])
                },
                markupRows: {
                    options: {},
                    board: board("H1", "2026-06-01", "2026-06-01", hourScale("H1", "2026-06-01", "2026-06-01"),
                        ["<b>L&amp;1</b>", "L2", "L3"], [
                            orderBarH1("L2", 7, "ORD-7", "09:00:00", "10:00:00"),
                            maintenanceBarH1()
                        ])
                },
                dst: {
                    options: {},
                    board: board("H1", "2026-03-29", "2026-03-29", hourScale("H1", "2026-03-29", "2026-03-29"), LINES, [
                        item("L1", 7, "ORD-7", "2026-03-29 01:30:00", "2026-03-29 03:30:00", HOURS_INTERVALS.H1, "2026-03-29")
                    ])
                },
                scrolled: {
                    options: {},
                    board: board("H1", "2026-06-01", "2026-06-04", hourScale("H1", "2026-06-01", "2026-06-04"), numberedRows(20), [
                        item("L12", 21, "ORD-21", "2026-06-02 10:00:00", "2026-06-02 11:00:00", HOURS_INTERVALS.H1, "2026-06-01")
                    ])
                },
                moveDisabled: {
                    options: {allowItemMove: false},
                    board: board("H1", "2026-06-01", "2026-06-01", hourScale("H1", "2026-06-01", "2026-06-01"), LINES, [
                        orderBarH1("L1", 7, "ORD-7", "09:00:00", "10:00:00"),
                        maintenanceBarH1()
                    ])
                }
            };

            // Returns the board definition of a name, or throws for an unknown name.
            function boardDefinition(name) {
                if (!Object.prototype.hasOwnProperty.call(boards, name)) {
                    throw new Error("Unknown board: " + name + "; boards: " + Object.keys(boards).join(", "));
                }
                return boards[name];
            }

            // Merges option sources over a deep copy of the base options; translations are merged key by key.
            function mergeOptions(base) {
                var merged = deepCopy(base);
                for (var sourceIndex = 1; sourceIndex < arguments.length; sourceIndex++) {
                    var source = arguments[sourceIndex] || {};
                    Object.keys(source).forEach(function (key) {
                        if (key === "translations" && source[key] !== null && typeof source[key] === "object") {
                            Object.keys(source[key]).forEach(function (translationKey) {
                                merged.translations[translationKey] = source[key][translationKey];
                            });
                        } else {
                            merged[key] = deepCopy(source[key]);
                        }
                    });
                }
                return merged;
            }

            // Returns the board content of a definition with the keys of the override content replaced.
            function mergeBoard(boardContent, overrideContent) {
                var merged = deepCopy(boardContent);
                if (overrideContent) {
                    Object.keys(overrideContent).forEach(function (key) {
                        merged[key] = deepCopy(overrideContent[key]);
                    });
                }
                return merged;
            }

            // Builds the component.jsp and ganttChart.jsp markup for window.mainTab.gridLayout.gantt inside the host.
            function buildComponentMarkup(options) {
                var optionsJson = JSON.stringify(options);
                if (/[&<>]/.test(optionsJson)) {
                    throw new Error("Component options must not contain &, < or >: " + optionsJson);
                }

                var componentElement = document.createElement("div");
                componentElement.id = GANTT_PATH;
                componentElement.className = "component";
                componentElement.style.height = "100%";

                var jsObjectElement = document.createElement("div");
                jsObjectElement.className = "element_js_object";
                jsObjectElement.style.display = "none";
                jsObjectElement.textContent = GANTT_JS_OBJECT;

                var optionsElement = document.createElement("div");
                optionsElement.className = "element_options";
                optionsElement.style.display = "none";
                optionsElement.textContent = optionsJson;

                var ganttElement = document.createElement("div");
                ganttElement.className = "component component_element component_element_ganttChart";
                ganttElement.id = GANTT_PATH;

                componentElement.appendChild(jsObjectElement);
                componentElement.appendChild(optionsElement);
                componentElement.appendChild(ganttElement);
                document.getElementById(HOST_ID).appendChild(componentElement);
                return componentElement;
            }

            // Resolves a dotted global name, such as QCD.components.elements.GanttChart, to its constructor.
            function resolveConstructor(className) {
                var resolved = window;
                className.split(".").forEach(function (part) {
                    resolved = (resolved !== null && resolved !== undefined) ? resolved[part] : undefined;
                });
                if (typeof resolved !== "function") {
                    throw new Error("No component constructor named " + className);
                }
                return resolved;
            }

            // Constructs the component of window.mainTab.gridLayout.gantt as pageConstructor.js does, sizes it to the
            // host and runs its initialization, which sends refresh.
            function constructGantt() {
                var element = $(document.getElementById(GANTT_PATH));
                var jsObjectElement = element.children(".element_js_object");
                var jsObjectClassName = $.trim(jsObjectElement.html());
                jsObjectElement.remove();

                var ComponentConstructor = resolveConstructor(jsObjectClassName);
                window.__gantt = new ComponentConstructor(element, window.mainController);
                window.__gantt.updateSize(HOST_WIDTH, HOST_HEIGHT);
                window.__gantt.performInitialize();
            }

            // Builds the component value that pageController.setValueData passes to component.setValue, in the
            // AbstractComponentState.render shape: updateState is true only when given as true, and without content the
            // value has no content key.
            function valueWrapper(content, updateState) {
                var value = {
                    enabled: true,
                    visible: true,
                    permanentlyDisabled: false,
                    messages: [],
                    updateState: updateState === true
                };
                if (content !== undefined) {
                    value.content = content;
                }
                return value;
            }

            // Answers an event as a successful response: runs the complete function, then sets the component value.
            function answerSuccess(completeFunction, value) {
                if (completeFunction) {
                    completeFunction();
                }
                window.__gantt.setValue(value);
            }

            // Answers an event as a failed request: runs only the complete function.
            function answerFailure(completeFunction) {
                if (completeFunction) {
                    completeFunction();
                }
            }

            // Returns the itemId of a moveItem payload, or null after recording a fixture error when the payload is
            // not a JSON object string.
            function readMoveItemId(args) {
                try {
                    var payload = JSON.parse(args[0]);
                    if (payload !== null && typeof payload === "object" && !Array.isArray(payload)) {
                        return payload.itemId === undefined ? null : payload.itemId;
                    }
                } catch (e) {
                    recordFixtureError("moveItem payload is not JSON: " + e.message);
                    return null;
                }
                recordFixtureError("moveItem payload is not a JSON object: " + String(args && args[0]));
                return null;
            }

            // Answers moveItem with the canned rejected, accepted, failed, error-page or accepted-without-board
            // response of window.__nextMoveResponse.
            function answerMoveItem(completeFunction, args) {
                var itemId = readMoveItemId(args || []);
                var response = window.__nextMoveResponse || DEFAULT_MOVE_RESPONSE;
                var moveResult;
                if (response.kind === "rejected") {
                    moveResult = {itemId: itemId, accepted: false};
                    if (response.message !== undefined && response.message !== null) {
                        moveResult.message = response.message;
                    }
                    answerSuccess(completeFunction, valueWrapper({moveResult: moveResult}, false));
                } else if (response.kind === "accepted") {
                    if (!response.board || typeof response.board !== "object") {
                        recordFixtureError("Accepted moveItem response has no board");
                        answerFailure(completeFunction);
                        return;
                    }
                    var content = deepCopy(response.board);
                    content.moveResult = {itemId: itemId, accepted: true};
                    window.__currentBoard = deepCopy(response.board);
                    answerSuccess(completeFunction, valueWrapper(content, true));
                    window.__gantt.updateSize(HOST_WIDTH, HOST_HEIGHT);
                } else if (response.kind === "failure") {
                    answerFailure(completeFunction);
                } else if (response.kind === "serverError") {
                    window.mainController.showMessage(deepCopy(SERVER_ERROR_MESSAGE));
                    answerFailure(completeFunction);
                } else if (response.kind === "acceptedWithoutBoard") {
                    moveResult = {itemId: itemId, accepted: true};
                    answerSuccess(completeFunction, valueWrapper({moveResult: moveResult}, false));
                } else {
                    recordFixtureError("Unknown moveItem response kind: " + String(response.kind));
                    answerFailure(completeFunction);
                }
            }

            // Answers refresh and initialize with the current board and updateState true, moveItem with the canned
            // response, and every other event, select included, with a value without content and updateState false.
            function answerEvent(eventName, completeFunction, args) {
                if (eventName === "refresh" || eventName === "initialize") {
                    answerSuccess(completeFunction, valueWrapper(deepCopy(window.__currentBoard), true));
                    window.__gantt.updateSize(HOST_WIDTH, HOST_HEIGHT);
                } else if (eventName === "moveItem") {
                    answerMoveItem(completeFunction, args);
                } else {
                    answerSuccess(completeFunction, valueWrapper(undefined, false));
                }
            }

            // Returns whether the next moveItem answer is held until window.__releaseHeldMove().
            function isMoveAnswerHeld(eventName) {
                return eventName === "moveItem" && !!window.__nextMoveResponse
                    && window.__nextMoveResponse.hold === true;
            }

            // Stores the answer of a moveItem as the held answer. The answer is dropped when a board is loaded before
            // it runs; otherwise it answers the event and records the answer in window.__lastResponseApplied.
            function holdMoveAnswer(completeFunction, args) {
                var callGeneration = generation;
                heldMoveAnswer = function () {
                    if (callGeneration !== generation || !window.__gantt) {
                        return;
                    }
                    try {
                        answerEvent("moveItem", completeFunction, args);
                    } finally {
                        window.__seq += 1;
                        window.__lastResponseApplied = {eventName: "moveItem", seq: window.__seq};
                    }
                };
            }

            // Content type of every reply of the XMLHttpRequest stand-in.
            var HTTP_REPLY_CONTENT_TYPE = "application/json;charset=UTF-8";

            // Page controller that sends the moveItem events of httpReply answers, or null until the first of them.
            var transportController = null;

            // Returns the page controller of httpReply answers. On first use it is created with
            // new QCD.PageController(), and its this.constructor initializer, which crudView.jsp calls with viewName,
            // pluginIdentifier, hasDataDefinition and popup, is not called; it has no page components and gets a window
            // header that records its blockButtons and unblockButtons calls in window.__headerButtonCalls.
            function getTransportController() {
                if (transportController === null) {
                    transportController = new QCD.PageController();
                    transportController.setWindowHeaderComponent({
                        blockButtons: function () {
                            window.__headerButtonCalls.push("block");
                        },
                        unblockButtons: function () {
                            window.__headerButtonCalls.push("unblock");
                        }
                    });
                }
                return transportController;
            }

            // Returns an XMLHttpRequest stand-in class for one reply. send records the request in window.__httpRequests
            // and completes it at once with the reply's status and body, the status text "OK" for 200 and "Error"
            // otherwise, and the HTTP_REPLY_CONTENT_TYPE header; jQuery then answers after a zero delay.
            function replyXhrClass(reply) {
                function ReplyXhr() {
                    this.readyState = 0;
                    this.status = 0;
                    this.statusText = "";
                    this.responseText = "";
                    this.responseXML = null;
                    this.onreadystatechange = null;
                    this.request = {method: null, url: null, async: null, body: null, headers: {}};
                }
                ReplyXhr.prototype.open = function (method, requestUrl, async) {
                    this.request.method = method;
                    this.request.url = requestUrl;
                    this.request.async = async;
                    this.readyState = 1;
                };
                ReplyXhr.prototype.setRequestHeader = function (name, value) {
                    this.request.headers[name] = value;
                };
                ReplyXhr.prototype.send = function (body) {
                    this.request.body = body === undefined ? null : body;
                    window.__httpRequests.push(deepCopy(this.request));
                    this.status = reply.status;
                    this.statusText = reply.status === 200 ? "OK" : "Error";
                    this.responseText = reply.body;
                    this.readyState = 4;
                };
                ReplyXhr.prototype.getAllResponseHeaders = function () {
                    return this.readyState === 4 ? "Content-Type: " + HTTP_REPLY_CONTENT_TYPE + "\r\n" : "";
                };
                ReplyXhr.prototype.getResponseHeader = function (name) {
                    return this.readyState === 4 && String(name).toLowerCase() === "content-type"
                        ? HTTP_REPLY_CONTENT_TYPE : null;
                };
                ReplyXhr.prototype.abort = function () {
                    this.readyState = 0;
                    this.status = 0;
                    this.statusText = "";
                    this.responseText = "";
                };
                return ReplyXhr;
            }

            // Returns whether the next moveItem is answered by an HTTP reply through the real event transport.
            function isMoveSentOverHttp(eventName) {
                return eventName === "moveItem" && !!window.__nextMoveResponse
                    && window.__nextMoveResponse.kind === "httpReply";
            }

            // Sends a moveItem through QCD.PageController.callEvent, performEvent, QCDConnector.sendPost and
            // jQuery.ajax of the transport page controller. While the request is sent, window.XMLHttpRequest is the
            // reply stand-in and a document ajaxSend handler keeps the jqXHR of the first request. The complete function
            // the transport calls runs the complete function of the event and then records the answer; a request that
            // jQuery rejects records the answer after a zero delay unless it is recorded by then, so each request
            // records it in window.__lastResponseApplied once. Neither runs after a board is loaded. A reply without a
            // numeric status and a string body records a fixture error and is answered after a zero delay without a
            // request.
            function sendMoveOverHttp(completeFunction, args) {
                var reply = window.__nextMoveResponse;
                var callGeneration = generation;
                var answerRecorded = false;
                var recordAnswer = function () {
                    if (answerRecorded || callGeneration !== generation || !window.__gantt) {
                        return;
                    }
                    answerRecorded = true;
                    window.__seq += 1;
                    window.__lastResponseApplied = {eventName: "moveItem", seq: window.__seq};
                };
                var transportComplete = function () {
                    if (callGeneration !== generation || !window.__gantt) {
                        return;
                    }
                    try {
                        if (completeFunction) {
                            completeFunction();
                        }
                    } finally {
                        recordAnswer();
                    }
                };
                if (typeof reply.status !== "number" || typeof reply.body !== "string") {
                    recordFixtureError("httpReply moveItem response needs a numeric status and a string body");
                    setTimeout(transportComplete, 0);
                    return;
                }
                var eventTransport = getTransportController();
                var nativeXhr = window.XMLHttpRequest;
                var transportXhr = null;
                var captureTransportXhr = function (event, jqXHR) {
                    if (transportXhr === null) {
                        transportXhr = jqXHR;
                    }
                };
                QCDConnector.windowName = "/page/" + pluginIdentifier + "/" + viewName;
                QCDConnector.mainController = window.mainController;
                window.XMLHttpRequest = replyXhrClass({status: reply.status, body: reply.body});
                $(document).bind("ajaxSend", captureTransportXhr);
                try {
                    eventTransport.callEvent("moveItem", null, transportComplete, args);
                } finally {
                    window.XMLHttpRequest = nativeXhr;
                    $(document).unbind("ajaxSend", captureTransportXhr);
                }
                if (transportXhr !== null) {
                    transportXhr.fail(function () {
                        setTimeout(recordAnswer, 0);
                    });
                }
            }

            // Recording stub of QCD.PageController: callEvent and showMessage.
            window.mainController = {
                // Records an event call, then answers it through the real event transport for an httpReply moveItem
                // answer, keeps the answer until window.__releaseHeldMove() for a hold: true moveItem answer, and
                // otherwise answers it after a zero delay; each answer is recorded in window.__lastResponseApplied.
                callEvent: function (eventName, component, completeFunction, args, actionsPerformer, type) {
                    window.__calls.push({
                        eventName: eventName,
                        component: component,
                        args: args ? Array.prototype.slice.call(args) : null
                    });
                    if (isMoveSentOverHttp(eventName)) {
                        sendMoveOverHttp(completeFunction, args);
                        return;
                    }
                    if (isMoveAnswerHeld(eventName)) {
                        holdMoveAnswer(completeFunction, args);
                        return;
                    }
                    var callGeneration = generation;
                    setTimeout(function () {
                        if (callGeneration !== generation || !window.__gantt) {
                            return;
                        }
                        try {
                            answerEvent(eventName, completeFunction, args);
                        } finally {
                            window.__seq += 1;
                            window.__lastResponseApplied = {eventName: eventName, seq: window.__seq};
                        }
                    }, 0);
                },

                // Records a message.
                showMessage: function (message) {
                    window.__messages.push(message);
                }
            };

            // Renders a board: rebuilds the host markup with the merged options, sets the current board, resets the
            // recorded calls, messages, HTTP requests, header button calls, last answer and next moveItem response, and
            // constructs the component.
            window.__loadBoard = function (name, overrides) {
                var definition = boardDefinition(name);
                var boardOverrides = overrides || {};

                generation += 1;
                heldMoveAnswer = null;
                window.__calls = [];
                window.__messages = [];
                window.__httpRequests = [];
                window.__headerButtonCalls = [];
                window.__lastResponseApplied = null;
                window.__nextMoveResponse = deepCopy(DEFAULT_MOVE_RESPONSE);
                window.__currentBoard = mergeBoard(definition.board, boardOverrides.board);
                window.__gantt = null;

                var host = document.getElementById(HOST_ID);
                while (host.firstChild) {
                    host.removeChild(host.firstChild);
                }

                buildComponentMarkup(mergeOptions(BASE_OPTIONS, definition.options, boardOverrides.options));
                constructGantt();
            };

            // Returns a mutable deep copy of the board content of a name.
            window.__boardFor = function (name) {
                return deepCopy(boardDefinition(name).board);
            };

            // Runs the held moveItem answer after a zero delay and returns true, or records a fixture error and returns
            // false when no moveItem is held.
            window.__releaseHeldMove = function () {
                if (!heldMoveAnswer) {
                    recordFixtureError("No held moveItem answer to release");
                    return false;
                }
                var answer = heldMoveAnswer;
                heldMoveAnswer = null;
                setTimeout(answer, 0);
                return true;
            };

            window.__boards = deepFreeze(deepCopy(boards));
        }());
    </script>
